name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Resolver dependências com versões corrigidas
        timeout-minutes: 5
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --no-progress
          npm audit fix --ignore-scripts --no-fund --no-progress

      - name: Install dependencies
        run: npm ci

      - name: Diagnosticar e exigir auditoria npm limpa
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); const v=a.vulnerabilities||{}; console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, packages:Object.entries(v).map(([name,x])=>({name,severity:x.severity,range:x.range,fixAvailable:x.fixAvailable,paths:x.nodes}))},null,2))'
          npm audit --audit-level=low

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verificar tipos das Edge Functions de email
        run: deno check --node-modules-dir=none supabase/functions/process-email-outbox/index.ts supabase/functions/register-user/index.ts supabase/functions/send-order-update-email/index.ts supabase/functions/send-otp-email/index.ts supabase/functions/send-support-email/index.ts

      - name: Verificar tipos das Edge Functions multiagente
        run: deno check --node-modules-dir=none supabase/functions/agent-task-submit/index.ts supabase/functions/agent-orchestrator-worker/index.ts

      - name: Testar validação das tarefas multiagente
        run: deno test --node-modules-dir=none supabase/functions/_shared/agent-task-validation.test.ts

      - name: Auditar nomes das migrations (informativo)
        run: npm run audit:migrations

      - name: Run lint
        run: npm run lint

      - name: Verificar tipos TypeScript
        run: npm run type-check:strict

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Commit package-lock corrigido e revalidar SHA
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json já está actualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): remediate npm security advisories"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches \
            -d "{\"ref\":\"${GITHUB_HEAD_REF}\"}"
