name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verificar tipos das Edge Functions multiagente
        run: deno check --node-modules-dir=none supabase/functions/agent-task-submit/index.ts supabase/functions/agent-orchestrator-worker/index.ts

      - name: Testar validação das tarefas multiagente
        run: deno test --node-modules-dir=none supabase/functions/_shared/agent-task-validation.test.ts

      - name: Auditar nomes das migrations (informativo)
        run: npm run audit:migrations

      - name: Run lint
        run: npm run lint

      - name: Verificar tipos TypeScript
        run: npm run type-check:strict

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build
