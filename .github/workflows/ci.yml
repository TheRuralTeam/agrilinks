name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: email_outbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d email_outbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Diagnosticar e exigir auditoria npm limpa
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); const v=a.vulnerabilities||{}; console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, packages:Object.entries(v).map(([name,x])=>({name,severity:x.severity,range:x.range,fixAvailable:x.fixAvailable,paths:x.nodes}))},null,2))'
          npm audit --audit-level=low

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verificar tipos das Edge Functions de email
        run: deno check --node-modules-dir=none supabase/functions/process-email-outbox/index.ts supabase/functions/register-user/index.ts supabase/functions/send-order-update-email/index.ts supabase/functions/send-otp-email/index.ts supabase/functions/send-support-email/index.ts

      - name: Verificar tipos das Edge Functions multiagente
        run: deno check --node-modules-dir=none supabase/functions/agent-task-submit/index.ts supabase/functions/agent-orchestrator-worker/index.ts

      - name: Testar validação das tarefas multiagente
        run: deno test --node-modules-dir=none supabase/functions/_shared/agent-task-validation.test.ts

      - name: Validar migration da fila em PostgreSQL isolado
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d email_outbox_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE TABLE public.email_outbox (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            dedupe_key text NOT NULL UNIQUE,
            recipient text NOT NULL,
            subject text NOT NULL,
            template text NOT NULL DEFAULT 'notification',
            payload jsonb NOT NULL DEFAULT '{}'::jsonb,
            status text NOT NULL DEFAULT 'pending',
            attempts integer NOT NULL DEFAULT 0,
            available_at timestamptz NOT NULL DEFAULT now(),
            locked_at timestamptz,
            sent_at timestamptz,
            provider_id text,
            last_error text,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now(),
            priority smallint NOT NULL DEFAULT 50,
            scheduled_at timestamptz NOT NULL DEFAULT now()
          );
          SQL
          psql -h localhost -U postgres -d email_outbox_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261119120000_email_outbox_scrub_one_time_secrets.sql
          psql -h localhost -U postgres -d email_outbox_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE
            job_id uuid;
            job public.email_outbox;
          BEGIN
            INSERT INTO public.email_outbox (dedupe_key, recipient, subject, template, payload)
            VALUES ('test-success', 'test@example.com', 'Success', 'auth-otp', '{"otp_code":"123456","password":"temporary"}')
            RETURNING id INTO job_id;

            SELECT * INTO job FROM public.claim_email_outbox(10) WHERE id = job_id;
            IF job.status <> 'processing' OR job.attempts <> 1 THEN
              RAISE EXCEPTION 'claim did not lock and increment the job';
            END IF;

            PERFORM public.complete_email_outbox(job_id, 'resend-test-id');
            SELECT * INTO job FROM public.email_outbox WHERE id = job_id;
            IF job.status <> 'sent' OR job.provider_id <> 'resend-test-id'
              OR job.payload ? 'otp_code' OR job.payload ? 'password' THEN
              RAISE EXCEPTION 'completion did not persist provider ID and scrub secrets';
            END IF;

            INSERT INTO public.email_outbox (dedupe_key, recipient, subject, template, payload)
            VALUES ('test-auth-token', 'test@example.com', 'Auth token', 'auth-signup', '{"email":"test@example.com"}')
            RETURNING id INTO job_id;
            SELECT * INTO job FROM public.claim_email_outbox(10) WHERE id = job_id;
            PERFORM public.persist_email_outbox_auth_token(job_id, 'stable-hashed-token', 'signup');
            SELECT * INTO job FROM public.email_outbox WHERE id = job_id;
            IF job.payload->>'token_hash' <> 'stable-hashed-token' OR job.payload->>'auth_type' <> 'signup' THEN
              RAISE EXCEPTION 'auth token was not persisted before provider delivery';
            END IF;
            PERFORM public.fail_email_outbox(job_id, 'transient provider failure', true);
            UPDATE public.email_outbox SET available_at = now() WHERE id = job_id;
            SELECT * INTO job FROM public.claim_email_outbox(10) WHERE id = job_id;
            IF job.payload->>'token_hash' <> 'stable-hashed-token' OR job.payload->>'auth_type' <> 'signup' THEN
              RAISE EXCEPTION 'auth token changed across retry';
            END IF;
            PERFORM public.complete_email_outbox(job_id, 'resend-auth-test-id');
            SELECT * INTO job FROM public.email_outbox WHERE id = job_id;
            IF job.payload ? 'token_hash' THEN
              RAISE EXCEPTION 'auth token was not scrubbed after delivery';
            END IF;

            INSERT INTO public.email_outbox (dedupe_key, recipient, subject, template, payload)
            VALUES ('test-retry', 'test@example.com', 'Retry', 'auth-otp', '{"otp_code":"654321"}')
            RETURNING id INTO job_id;
            SELECT * INTO job FROM public.claim_email_outbox(10) WHERE id = job_id;
            PERFORM public.fail_email_outbox(job_id, 'transient failure', true);
            SELECT * INTO job FROM public.email_outbox WHERE id = job_id;
            IF job.status <> 'pending' OR job.attempts <> 1 OR NOT (job.payload ? 'otp_code')
              OR job.available_at <= now() THEN
              RAISE EXCEPTION 'retry did not preserve payload and schedule backoff';
            END IF;

            INSERT INTO public.email_outbox (dedupe_key, recipient, subject, template, attempts, payload)
            VALUES ('test-terminal', 'test@example.com', 'Terminal', 'auth-otp', 7, '{"otp_code":"000000"}')
            RETURNING id INTO job_id;
            SELECT * INTO job FROM public.claim_email_outbox(10) WHERE id = job_id;
            PERFORM public.fail_email_outbox(job_id, 'terminal failure', true);
            SELECT * INTO job FROM public.email_outbox WHERE id = job_id;
            IF job.status <> 'failed' OR job.attempts <> 8 OR job.payload ? 'otp_code' THEN
              RAISE EXCEPTION 'terminal failure did not scrub one-time credentials';
            END IF;

            IF has_function_privilege('anon', 'public.claim_email_outbox(integer)', 'EXECUTE')
              OR has_function_privilege('authenticated', 'public.complete_email_outbox(uuid,text)', 'EXECUTE')
              OR NOT has_function_privilege('service_role', 'public.fail_email_outbox(uuid,text,boolean)', 'EXECUTE')
              OR has_function_privilege('anon', 'public.persist_email_outbox_auth_token(uuid,text,text)', 'EXECUTE')
              OR NOT has_function_privilege('service_role', 'public.persist_email_outbox_auth_token(uuid,text,text)', 'EXECUTE') THEN
              RAISE EXCEPTION 'outbox RPC grants are not restricted to service_role';
            END IF;
          END;
          $test$;
          SQL

      - name: Validar ciclo de entrega em PostgreSQL isolado
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres purchase_delivery_test
          psql -h localhost -U postgres -d purchase_delivery_test -v ON_ERROR_STOP=1 -f supabase/tests/purchase_delivery_evidence_fixture.sql
          psql -h localhost -U postgres -d purchase_delivery_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261123120000_purchase_delivery_evidence.sql
          psql -h localhost -U postgres -d purchase_delivery_test -v ON_ERROR_STOP=1 -f supabase/tests/purchase_delivery_evidence.test.sql

      - name: Validar alocações financeiras do marketplace em PostgreSQL isolado
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres marketplace_payments_test
          psql -h localhost -U postgres -d marketplace_payments_test -v ON_ERROR_STOP=1 -f supabase/tests/marketplace_payment_allocations_fixture.sql
          psql -h localhost -U postgres -d marketplace_payments_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261123160000_marketplace_payment_allocations_and_release.sql
          psql -h localhost -U postgres -d marketplace_payments_test -v ON_ERROR_STOP=1 -f supabase/tests/marketplace_payment_allocations.test.sql

      - name: Auditar nomes das migrations (informativo)
        run: npm run audit:migrations

      - name: Run lint
        run: npm run lint

      - name: Verificar tipos TypeScript
        run: npm run type-check:strict

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build
